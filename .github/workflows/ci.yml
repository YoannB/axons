# CI — full verification (AGENTS.md Definition of done) before any merge into main.
# Trigger: pull requests to main only, drafts excluded. A commit on a branch without a PR,
# or on a Draft PR, runs nothing; "Ready for review" starts the pipeline.
# To make it mandatory in GitHub: Settings → Rules → Rulesets on main → Require status
# checks → "verify" (the job only appears in the list after a first run).
name: CI

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

# A new push to the same PR cancels the run in progress (no useless queue).
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        if: ${{ !github.event.pull_request.draft }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            # Build and E2E never call OpenRouter (/api/* mocked in Playwright,
            # in-memory quota with `next dev`): no secret required.
            NEXT_TELEMETRY_DISABLED: "1"
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format
              run: npm run format:check

            - name: Unit tests
              run: npm run test

            - name: Build
              run: npm run build

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: E2E tests
              run: npm run test:e2e

            - name: Storybook build
              run: npm run storybook:build

            - name: Audit (informatif)
              run: npm audit --audit-level=high
              continue-on-error: true

            - name: Upload Playwright report
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
