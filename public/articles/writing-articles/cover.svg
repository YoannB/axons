<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Markdown file with a YAML front matter">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1" />
            <stop offset="1" stop-color="#22d3ee" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="#0b1020" />
    <rect x="0" y="0" width="1200" height="630" fill="url(#bg)" opacity="0.18" />
    <rect x="360" y="95" width="480" height="440" rx="24" fill="#111a33" stroke="url(#bg)" stroke-width="4" />
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#9fb0d0">
        <text x="400" y="165">---</text>
        <text x="400" y="210"><tspan fill="#22d3ee">title</tspan>: Article</text>
        <text x="400" y="255"><tspan fill="#22d3ee">slug</tspan>: my-article</text>
        <text x="400" y="300"><tspan fill="#22d3ee">date</tspan>: 2026-11-10</text>
        <text x="400" y="345">---</text>
        <text x="400" y="410" fill="#e6ecff" font-weight="700"># Markdown</text>
    </g>
    <rect x="400" y="440" width="380" height="14" rx="7" fill="#2a3658" />
    <rect x="400" y="472" width="300" height="14" rx="7" fill="#2a3658" />
</svg>
